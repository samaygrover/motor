name: sync-develop-from-main

# Keeps `develop` fast-forwarded to `main` whenever `main` advances.
#
# Branching model: `claude/<feature>` -> PR -> `develop` -> PR -> `main`.
# After every merge into `main`, this workflow fast-forwards `develop` so the
# two stay in sync. If `develop` has diverged (genuine in-flight work), the
# fast-forward fails and we fall back to opening a tracking PR for review.
#
# Triggers on push to main only — never runs on PR events to avoid loops.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: develop
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Fast-forward develop to main
        id: ff
        run: |
          git fetch origin main:main
          if git merge-base --is-ancestor develop main; then
            echo "develop is behind main — fast-forwarding"
            git merge --ff-only main
            git push origin develop
            echo "result=ff" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor main develop; then
            echo "develop already contains main — no-op"
            echo "result=noop" >> "$GITHUB_OUTPUT"
          else
            echo "develop has diverged from main — cannot fast-forward, opening sync PR"
            echo "result=diverged" >> "$GITHUB_OUTPUT"
          fi
      - name: Open sync PR if diverged
        if: steps.ff.outputs.result == 'diverged'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="auto-sync/main-into-develop-${{ github.run_id }}"
          git checkout -b "$BRANCH" develop
          git merge main --no-edit || (git merge --abort && exit 1)
          git push origin "$BRANCH"
          gh pr create --base develop --head "$BRANCH" \
            --title "auto-sync: merge main into develop" \
            --body "develop diverged from main; this PR brings main's commits into develop. Review the merge resolution then squash-merge."
