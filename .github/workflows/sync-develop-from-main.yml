name: sync-develop-from-main

# Keeps `develop` fast-forwarded to `main` whenever `main` advances.
#
# Branching model: `claude/<feature>` -> PR -> `develop` -> PR -> `main`.
# After every merge into `main`, this workflow fast-forwards `develop` so the
# two stay in sync. If `develop` has diverged (genuine in-flight work), the
# fast-forward fails and we fall back to opening a tracking PR for review.
#
# Uses raw `git` + `gh` (both pre-installed on ubuntu-latest) to stay
# compatible with strict `allowed_actions: local_only` repo policies.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync develop from main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" repo
          cd repo
          git fetch origin main:main develop:develop
          git checkout develop

          if git merge-base --is-ancestor main develop; then
            echo "develop already contains main — no-op"
            exit 0
          fi

          if git merge-base --is-ancestor develop main; then
            echo "develop is behind main — fast-forwarding"
            git merge --ff-only main
            git push origin develop
            exit 0
          fi

          echo "develop has diverged from main — opening sync PR"
          BRANCH="auto-sync/main-into-develop-${{ github.run_id }}"
          git checkout -b "$BRANCH" develop
          if ! git merge main --no-edit; then
            git merge --abort
            echo "::error::Merge of main into develop produced conflicts. Resolve manually."
            exit 1
          fi
          git push origin "$BRANCH"
          gh pr create --base develop --head "$BRANCH" \
            --title "auto-sync: merge main into develop" \
            --body "develop diverged from main; this PR brings main's commits into develop. Review the merge resolution then squash-merge."
